# The main pipeline for jpn2030

resources:
  pipelines:
    jpn2030_etl:
      name: jpn2030_etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      root_path: "../src/jpn2030_etl"

      libraries:
        - glob:
            include: ../src/jpn2030_etl/transformations/**

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
